name: Agentic Workflow Outputs

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task for the agent to process"
        required: true
        default: "Summarise the latest changes in the repository"
      context:
        description: "Optional additional context for the task"
        required: false
        default: ""

jobs:
  # ── Agent job ─────────────────────────────────────────────────────────────
  # Runs the agent script and exposes its results as job outputs that
  # downstream jobs can consume via needs.<job>.outputs.<name>.
  agent:
    name: Run Agent
    runs-on: ubuntu-latest
    outputs:
      status:      ${{ steps.agent.outputs.status }}
      timestamp:   ${{ steps.agent.outputs.timestamp }}
      summary:     ${{ steps.agent.outputs.summary }}
      result_json: ${{ steps.agent.outputs.result_json }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run agent
        id: agent
        run: |
          python agent/process.py \
            --task "${{ inputs.task }}" \
            --context "${{ inputs.context }}"

  # ── Report job ────────────────────────────────────────────────────────────
  # Demonstrates consuming the agent's outputs in a downstream job.
  report:
    name: Report Results
    runs-on: ubuntu-latest
    needs: agent
    if: always()

    steps:
      - name: Display agent outputs
        run: |
          echo "## Agent Outputs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field     | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Status    | ${{ needs.agent.outputs.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | ${{ needs.agent.outputs.timestamp }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Summary   | ${{ needs.agent.outputs.summary }} |" >> $GITHUB_STEP_SUMMARY

      - name: Pretty-print full result
        run: |
          echo '${{ needs.agent.outputs.result_json }}' | python3 -m json.tool

      - name: Save result JSON to file
        run: |
          echo '${{ needs.agent.outputs.result_json }}' > agent-result.json

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-result
          path: agent-result.json
          if-no-files-found: error
